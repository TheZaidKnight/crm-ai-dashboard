name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & Build Checks
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://mock-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-for-build
      SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key-for-build
      AI_SERVICE_URL: http://localhost:5001
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests (Jest)
        run: npm test

      - name: Production Build Check (Next.js)
        run: npm run build
